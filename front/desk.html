<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>monid-x402 desk</title>
  <style>
    :root {
      --bg: #11130f;
      --ink: #e8eadc;
      --muted: #8b9178;
      --line: #2a2e24;
      --refuse: #c45c26;
      --gated: #c9a227;
      --ok: #7aa05a;
      --pad: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font: 14px/1.4 "IBM Plex Mono", ui-monospace, Menlo, monospace;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: var(--pad);
      border-bottom: 1px solid var(--line);
    }
    header strong { letter-spacing: 0.04em; }
    header span { color: var(--muted); font-size: 12px; }
    main {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: calc(100vh - 49px);
    }
    form {
      padding: var(--pad);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    label { color: var(--muted); font-size: 11px; text-transform: uppercase; }
    input, textarea {
      width: 100%;
      background: #0c0d0a;
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 8px;
      font: inherit;
    }
    textarea { min-height: 72px; resize: vertical; }
    .row { display: flex; gap: 8px; }
    .row label { flex: 1; }
    button {
      min-height: 44px;
      border: 1px solid var(--line);
      background: #1a1d16;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      padding: 8px 12px;
    }
    button.primary { background: #24281c; }
    button:focus { outline: 2px solid var(--ok); outline-offset: 2px; }
    button:hover { border-color: var(--ink); }
    pre {
      padding: var(--pad);
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .status { padding: 8px var(--pad); border-bottom: 1px solid var(--line); color: var(--muted); }
    .status.refuse { color: var(--refuse); }
    .status.gated { color: var(--gated); }
    .status.paid { color: var(--ok); }
    @media (max-width: 720px) {
      main { grid-template-columns: 1fr; }
      form { border-right: 0; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <strong>monid-x402 desk</strong>
    <span>loopback operate · listen has no wallet · Base/Monad</span>
  </header>
  <main>
    <form id="desk">
      <div>
        <label for="provider">provider</label>
        <input id="provider" name="provider" value="context.dev" autocomplete="off">
      </div>
      <div>
        <label for="endpoint">endpoint</label>
        <input id="endpoint" name="endpoint" value="/web/scrape/markdown" autocomplete="off">
      </div>
      <div>
        <label for="input">input JSON</label>
        <textarea id="input" name="input">{}</textarea>
      </div>
      <div class="row">
        <label>cap micro
          <input id="cap" name="cap" value="1" inputmode="numeric">
        </label>
      </div>
      <button type="submit" id="probe">POST /v1/run (default refuse)</button>
      <button type="button" class="primary" id="confirm">confirm-spend (listen stays 403)</button>
    </form>
    <section>
      <div class="status" id="status">idle</div>
      <pre id="out">No packet yet.</pre>
    </section>
  </main>
  <script>
    const statusEl = document.getElementById("status");
    const out = document.getElementById("out");
    function body() {
      let input = {};
      try { input = JSON.parse(document.getElementById("input").value || "{}"); }
      catch (e) { throw new Error("input JSON invalid"); }
      return {
        provider: document.getElementById("provider").value.trim(),
        endpoint: document.getElementById("endpoint").value.trim(),
        input
      };
    }
    function paint(http, packet) {
      const code = packet && packet.code;
      const decision = packet && packet.decision;
      statusEl.className = "status";
      if (decision === "refuse" || http === 402) statusEl.classList.add("refuse");
      else if (decision === "spend_gated" || http === 403) statusEl.classList.add("gated");
      else if (packet && packet.kind === "paid") statusEl.classList.add("paid");
      statusEl.textContent = http + " " + (decision || code || packet && packet.kind || "");
      out.textContent = JSON.stringify(packet, null, 2);
    }
    async function run(headers) {
      statusEl.className = "status";
      statusEl.textContent = "…";
      const res = await fetch("/v1/run", {
        method: "POST",
        headers: Object.assign({ "content-type": "application/json" }, headers),
        body: JSON.stringify(body())
      });
      const packet = await res.json();
      paint(res.status, packet);
    }
    document.getElementById("desk").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const cap = document.getElementById("cap").value.trim() || "1";
      await run({ "X-TWZRD-Max-Amount-Micro": cap });
    });
    document.getElementById("confirm").addEventListener("click", async () => {
      await run({
        "X-TWZRD-Max-Amount-Micro": "10000",
        "X-TWZRD-Confirm-Spend": "true"
      });
    });
  </script>
</body>
</html>
